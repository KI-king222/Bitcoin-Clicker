<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpool — loading…</title>
</head>
<body style="margin:0;background:#0b0d10;color:#e7e9ec;font-family:monospace;padding:40px;text-align:center">
<p id="st">Loading Hashpool…</p>
<script>
(async function () {
  var st = document.getElementById("st");
  try {
    var url = "https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@0611b74af3c121ca0e69c5b0f8d6bb56bd105e46/index.html";
    st.textContent = "Fetching full game…";
    var r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.textContent = "Load failed: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
