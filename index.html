<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpool — loading…</title></head>
<body style="background:#0b0d10;color:#e7e9ec;font-family:monospace;padding:40px;text-align:center">
<p id="st">Loading Hashpool…</p>
<script>
(async function(){
  const st = document.getElementById("st");
  const N = 35;
  try {
    let b64 = "";
    for (let i = 0; i < N; i++) {
      st.textContent = "Loading " + (i+1) + "/" + N + "…";
      const r = await fetch("c" + i + ".b64?t=" + Date.now());
      if (!r.ok) throw new Error("Failed c" + i + " (" + r.status + ")");
      b64 += (await r.text()).trim();
    }
    st.textContent = "Decompressing…";
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    st.textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>
</body></html>
