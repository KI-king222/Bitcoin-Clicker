<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpool — loading…</title>
</head>
<body style="margin:0;background:#0b0d10;color:#e7e9ec;font-family:monospace;padding:40px;text-align:center">
<p id="st">Loading Hashpool…</p>
<script>
(async function () {
  var st = document.getElementById("st");
  try {
    st.textContent = "Fetching game…";
    var url = "https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@0611b74af3c121ca0e69c5b0f8d6bb56bd105e46/index.html";
    var r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = await r.text();
    if (html.indexOf("mine-btn") === -1) throw new Error("Game HTML incomplete");

    html = html.replace(
      /function fmtSats\(n\)\{[\s\S]*?\n  \}/,
      "function fmtSats(n){\n    n = Number(n) || 0;\n    if(n === 0) return \"0\";\n    var abs = Math.abs(n);\n    if(abs < 1) return (Math.round(n * 100) / 100).toFixed(2);\n    if(abs < 10 && n % 1 !== 0) return (Math.round(n * 10) / 10).toFixed(1);\n    if(abs < 1e6) return String(Math.floor(n));\n    if(abs < 1e9) return (Math.floor(n / 1e4) / 100).toFixed(2) + \"M\";\n    return (Math.floor(n / 1e7) / 100).toFixed(2) + \"B\";\n  }"
    );

    var helpers = "var _uiBal=\"\",_uiUsd=\"\",_uiHr=\"\";function updateBalanceUI(){var b=fmtSats(state.balance)+\"<small> sats</small>\";if(b!==_uiBal){_uiBal=b;balanceEl.innerHTML=b;}var u=\"≈ \"+fmtUSD(state.balance);if(u!==_uiUsd){_uiUsd=u;usdEl.textContent=u;}var h=fmtSats(passiveRate())+\" \"+t(\"passive\")+\" · \"+fmtSats(state.perClick)+\" \"+t(\"perClick\");if(h!==_uiHr){_uiHr=h;hrEl.textContent=h;}}function updateShopDisabled(){Array.prototype.forEach.call(shopClickEl.children,function(row){var d=state.balance<Number(row.dataset.cost);if(row.disabled!==d)row.disabled=d;});Array.prototype.forEach.call(shopEl.children,function(row){var d=state.balance<Number(row.dataset.cost);if(row.disabled!==d)row.disabled=d;});}";
    html = html.replace(/(var balanceEl = document\.getElementById\("balance"\);)/, "$1\n  " + helpers);
    html = html.replace(/(spawnFloat\(gain, \(Math\.random\(\)\*20-10\), crit\);\s*save\(\);\s*)render\(\);/, "$1updateBalanceUI();updateShopDisabled();");

    html = html.replace(
      /openPasteStage\(function\(\)\{\s*bootPlayed\s*=\s*true;[\s\S]*?render\(\);\s*\}\);/,
      "openPasteStage(function(){\n            openBiosStage(function(){\n              bootPlayed = true;\n              bootPlaying = false;\n              var bs = document.getElementById(\"boot-screen\");\n              if(bs) bs.style.display = \"none\";\n              save();\n              render();\n            });\n          });"
    );

    html = html.replace(
      "if(audioCtx && audioCtx.state === \"suspended\"){ audioCtx.resume(); }",
      "if(audioCtx && audioCtx.state === \"suspended\"){ try{ audioCtx.resume(); }catch(e){} }"
    );
    html = html.replace(
      "function sfxClick(){ beep(520, 0.05, \"sine\", 0.10); }",
      "function sfxClick(){ beep(520, 0.055, \"sine\", 0.16); }"
    );
    html = html.replace(
      "function beep(freq, dur, type, vol){\n    if(state.muted) return;\n    var ctx = ensureAudio();\n    if(!ctx) return;",
      "function beep(freq, dur, type, vol){\n    if(state.muted) return;\n    var ctx = ensureAudio();\n    if(!ctx) return;\n    if(ctx.state===\"suspended\"){ try{ ctx.resume(); }catch(e){} }"
    );
    html = html.replace(
      "var audioCtx = null;\n  function ensureAudio(){",
      "var audioCtx = null;\n  function unlockAudio(){ try{ var c=ensureAudio(); if(c&&c.state===\"suspended\") c.resume(); }catch(e){} }\n  document.addEventListener(\"pointerdown\", unlockAudio, {passive:true});\n  document.addEventListener(\"touchstart\", unlockAudio, {passive:true});\n  function ensureAudio(){"
    );

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.innerHTML = "Load failed: " + e.message +
      "<br><br><a style=\"color:#f7931a\" href=\"https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@0611b74af3c121ca0e69c5b0f8d6bb56bd105e46/index.html\">Direct game link</a>";
    console.error(e);
  }
})();
</script>
</body>
</html>
