<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpool — loading…</title></head>
<body style="background:#0b0d10;color:#e7e9ec;font-family:monospace;padding:40px;text-align:center">
<p id="st">Loading Hashpool…</p>
<script>
(async function(){
  const st = document.getElementById("st");
  try {
    const names = ["hp_part0.b64","hp_part1.b64","hp_part2.b64"];
    let html = "";
    for (const n of names) {
      st.textContent = "Loading " + n + "…";
      const r = await fetch(n + "?t=" + Date.now());
      if (!r.ok) throw new Error("Failed " + n + " (" + r.status + ")");
      const b64 = (await r.text()).trim();
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const ds = new DecompressionStream("gzip");
      const stream = new Blob([bin]).stream().pipeThrough(ds);
      const text = await new Response(stream).text();
      html += text;
    }
    st.textContent = "Starting…";
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>
</body></html>
