<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpool — Bitcoin Miner</title>
<script>
// Load last known-good build (before accidental PLACEHOLDER overwrite).
// UX fixes are in the repo artifacts / ready to re-apply once full file push works.
(async function () {
  try {
    const url = "https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@69f20fe252337cd2970eb3dc06bd9ca3bfcad1f3/index.html";
    const r = await fetch(url);
    if (!r.ok) throw new Error("CDN " + r.status);
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = "<pre style='color:#e7e9ec;background:#0b0d10;padding:24px;font-family:monospace'>Could not load Hashpool: " + e.message + "\n\nOpen the previous good version:\nhttps://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@69f20fe252337cd2970eb3dc06bd9ca3bfcad1f3/index.html</pre>";
  }
})();
</script>
</head>
<body style="background:#0b0d10;color:#7c8794;font-family:monospace;padding:40px;text-align:center">
Loading Hashpool…
</body>
</html>
