<body style="margin:0;background:#0b0d10;color:#e7e9ec;font-family:monospace;padding:40px;text-align:center">
<p id="st">Loading HASHPOOL — Bitcoin Miner…</p>
<noscript><h1>HASHPOOL — Bitcoin Miner</h1><p>Free idle Bitcoin mining clicker. Play at <a href="https://hashpool.pages.dev/">hashpool.pages.dev</a>.</p></noscript>
<script>
(async function () {
  var st = document.getElementById("st");
  try {
    st.textContent = "Fetching game…";
    var GAME = "https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@0611b74af3c121ca0e69c5b0f8d6bb56bd105e46/index.html";
    var RAW = "https://raw.githubusercontent.com/KI-king222/Bitcoin-Clicker/main";

    try {
      var sr = await fetch(RAW + "/status.json", { cache: "no-store" });
      if (sr.ok) {
        var status = await sr.json();
        if (status && status.maintenance) {
          var de = (typeof navigator !== "undefined" && /^de/i.test(navigator.language || "")) || status.lang === "de";
          var title = de ? (status.title_de || "HASHPOOL — Wartung") : (status.title_en || "HASHPOOL — Maintenance");
          var msg = de
            ? (status.message_de || "Wir arbeiten gerade an der Seite. Bitte schau bald wieder vorbei.")
            : (status.message_en || "We're improving the game. Please check back soon.");
          var eta = status.eta
            ? ("<p style=\"color:#8b95a5;font-size:13px;margin-top:18px\">" + (de ? "Voraussichtlich wieder: " : "Back around: ") + status.eta + "</p>")
            : "";
          document.title = title;
          document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0d10;color:#e7e9ec;font-family:system-ui,-apple-system,sans-serif;text-align:center">' +
            '<div style="max-width:420px">' +
            '<div style="font-size:42px;margin-bottom:12px">⛏️</div>' +
            '<h1 style="font-size:22px;margin:0 0 10px;font-weight:800">' + title + '</h1>' +
            '<p style="color:#c0c6d0;line-height:1.5;margin:0">' + msg + '</p>' + eta +
            '<p style="margin-top:28px;font-size:12px;color:#5a6575">hashpool.pages.dev</p>' +
            '</div></div>';
          return;
        }
      }
    } catch (_st) {}

    var r = await fetch(GAME, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = await r.text();
    if (html.indexOf("mine-btn") === -1) throw new Error("Game HTML incomplete");

    st.textContent = "Loading Parts Shop…";
    var cssText = "", catText = "", shopText = "", parts3dText = "", tutText = "";
    try {
      var p3d = ["registry","cpu","gpu","ram","ssd","psu","cooler","patch"];
      var rc = await Promise.all([
        fetch(RAW + "/css/partShop.css", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/partCatalog.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/partShop.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/partCheat.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/saveApi.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/tutorial.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; }),
        fetch(RAW + "/js/partShopFix.js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; })
      ].concat(p3d.map(function(n){
        return fetch(RAW + "/js/parts3d/" + n + ".js", {cache:"no-store"}).then(function(x){ return x.ok ? x.text() : ""; });
      })));
      cssText = rc[0] || "";
      catText = rc[1] || "";
      shopText = (rc[2] || "") + "\n" + (rc[3] || "") + "\n" + (rc[4] || "") + "\n" + (rc[6] || "");
      tutText = rc[5] || "";
      parts3dText = rc.slice(7).filter(Boolean).join("\n");
    } catch (e) { console.warn("Parts Shop modules", e); }

    if (cssText) {
      if (html.indexOf("<" + "/style>") !== -1) html = html.replace("<" + "/style>", "\n" + cssText + "\n<" + "/style>");
      else html = html.replace("<" + "/head>", "<style>" + cssText + "</style><" + "/head>");
    }
    if (html.indexOf("id=\"ps-open-btn\"") === -1) {
      var _psLang = ((typeof navigator!=="undefined"&&(navigator.language||"")).slice(0,2)==="de")?"de":"en";
      var btn = '<button type="button" id="ps-open-btn" class="ps-open-btn">🛒 <span id="ps-open-label">'+(_psLang==="de"?"Teile-Shop":"Parts Shop")+'</span></button>';
      if (html.indexOf("id=\"open-build-btn\"") !== -1) {
        html = html.replace(/<button([^>]*id="open-build-btn")/, btn + "<button$1");
      }
      var ov = '<div class="ps-overlay" id="ps-overlay"><div class="ps-top"><button type="button" class="ps-back" id="ps-back" style="visibility:hidden">←</button><h2 id="ps-title">Teile-Shop</h2><div class="ps-sats" id="ps-sats">0 sats</div><button type="button" class="ps-close" id="ps-close">✕</button></div><div class="ps-body" id="ps-body"></div></div><div class="ps-toast" id="ps-toast"></div>';
      if (html.indexOf("id=\"build-overlay\"") !== -1) {
        html = html.replace('<div class="build-overlay" id="build-overlay"', ov + '<div class="build-overlay" id="build-overlay"');
      } else {
        html = html.replace("<" + "/body>", ov + "<" + "/body>");
      }
    }
    if (catText && shopText && html.indexOf("PART_CATALOG") === -1) {
      var js = "\n" + catText + "\n" + shopText + "\n" + (tutText || "") + "\n";
      var mark = "PARTS.forEach(function(p){ PARTS_BY_ID[p.id] = p; });";
      if (html.indexOf(mark) !== -1) html = html.replace(mark, mark + js);
      else html = html.replace("<" + "/scr" + "ipt>", js + "<" + "/scr" + "ipt>");
    } else if (tutText && html.indexOf("HashpoolTutorial") === -1) {
      html = html.replace("<" + "/scr" + "ipt>", "\n" + tutText + "\n<" + "/scr" + "ipt>");
    }
    if (html.indexOf("tutorialDone") === -1) {
      html = html.replace("buildBought: {},", "buildBought: {}, tutorialDone: false,");
    }
    if (parts3dText && html.indexOf("Parts3DBind") === -1) {
      var p3 = "\n" + parts3dText + "\n try{ if(window.Parts3D){ if(Parts3D.buildCpu) buildCpu=Parts3D.buildCpu; if(Parts3D.buildGpu) buildGpu=Parts3D.buildGpu; if(Parts3D.buildRam) buildRamStick=function(c){return Parts3D.buildRam(c);}; if(Parts3D.buildSsd) buildSsd=Parts3D.buildSsd; if(Parts3D.buildPsu) buildPsu=Parts3D.buildPsu; if(Parts3D.buildCooler) buildCooler=Parts3D.buildCooler; } }catch(_p3){} /*Parts3DBind*/\n";
      var mark2 = "PARTS.forEach(function(p){ PARTS_BY_ID[p.id] = p; });";
      if (html.indexOf(mark2) !== -1) html = html.replace(mark2, mark2 + p3);
      else html = html.replace("<" + "/scr" + "ipt>", p3 + "<" + "/scr" + "ipt>");
    }
    if (html.indexOf("PartShopConsumeHook") === -1) {
      html = html.replace(
        "function sellRig(reward){",
        "function sellRig(reward){ try{ if(window.PartShop&&PartShop.consumeBuildParts) PartShop.consumeBuildParts(); else if(window.PartShop&&PartShop.clearBuildSelectionUI) PartShop.clearBuildSelectionUI(); }catch(_e){} /*PartShopConsumeHook*/"
      );
    }
    if (html.indexOf("PartShopCostHook") === -1) {
      html = html.replace(
        "function buildTotalCost(){\n    var total = 0;\n    PARTS.forEach(function(p){ total += buildPartCost(p); });\n    return total;\n  }",
        "function buildTotalCost(){ /*PartShopCostHook*/ try{ if(window.PartShop&&PartShop.selectedBuildCost){ var c=PartShop.selectedBuildCost(); if(c>0) return c; } }catch(_e){} var total=0; PARTS.forEach(function(p){ total+=buildPartCost(p); }); return total; }"
      );
      html = html.replace("buildTotalCost() * 1.38 * pasteMul", "(buildTotalCost() * ((window.PartShop&&PartShop.sellMult)?PartShop.sellMult():1.22) * pasteMul)");
    }
    if (html.indexOf("XR7K-M9PQ") === -1) {
      html = html.replace('"HODLGANG": { sats: 25000000 }', '"HODLGANG": { sats: 25000000 }, "XR7K-M9PQ": { allParts: 1 }, "N0DE-INV-01": { allParts: 1 }');
    }
    if (html.indexOf("PartInvPersist") === -1) {
      html = html.replace(/buildBought: \{\},/g, "buildBought: {}, partInv: {}, buildPick: {},");
      html = html.replace(/buildBought:state\.buildBought,/g, "partInv:state.partInv||{},buildPick:state.buildPick||{},buildBought:state.buildBought,");
      html = html.replace(/state\.buildBought = saved\.buildBought \|\| state\.buildBought;/g, "state.partInv = saved.partInv || state.partInv || {}; state.buildPick = saved.buildPick || state.buildPick || {}; state.buildBought = saved.buildBought || state.buildBought; /*PartInvPersist*/");
    }

    if (html.indexOf("NoZoomViewport") === -1) {
      html = html.replace(
        /<meta name="viewport"[^>]*>/,
        '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><!--NoZoomViewport-->'
      );
      var noZoomCss = "\n/* no mobile zoom on mine */\nhtml,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;}\n#mine-btn,button,.shop-row,.ps-open-btn,.ps-buy-btn,.ps-acc-head,.ps-row{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}\n#mine-btn{touch-action:manipulation;}\n";
      if (html.indexOf("</style>") !== -1) html = html.replace("</style>", noZoomCss + "</style>");
      else if (html.indexOf("<"+"/style>") !== -1) html = html.replace("<"+"/style>", noZoomCss + "<"+"/style>");
      var noZoomJs = "\ntry{(function(){document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});var mb=document.getElementById('mine-btn');if(mb){mb.style.touchAction='manipulation';}})();}catch(_z){}\n";
      html = html.replace("<" + "/scr" + "ipt>", noZoomJs + "<" + "/scr" + "ipt>");
    }

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.innerHTML = "Load failed: " + e.message +
      "<br><br><a style=\"color:#f7931a\" href=\"https://cdn.jsdelivr.net/gh/KI-king222/Bitcoin-Clicker@0611b74af3c121ca0e69c5b0f8d6bb56bd105e46/index.html\">Direct game link</a>";
    console.error(e);
  }
})();
</script>
